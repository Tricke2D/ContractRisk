version: "3.9"

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: cra_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: cra_admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_locally}
      POSTGRES_DB: contract_risk_auditor
    ports:
      - "5432:5432"
    volumes:
      - cra_postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cra_admin"]
      interval: 5s
      timeout: 5s
      retries: 5

  ollama:
    image: ollama/ollama
    container_name: cra_ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - cra_ollama_data:/root/.ollama

volumes:
  cra_postgres_data:
  cra_ollama_data: