[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "contract-risk-auditor"
version = "0.1.0"
description = "AI-powered contract risk auditor with clause segmentation and deviation analysis"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    {name = "Your Name", email = "you@email.com"}
]

[project.scripts]
cra = "contract_risk_auditor.main:main"

[tool.poetry]
package-mode = false

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.111.0"
uvicorn = {extras = ["standard"], version = "^0.30.0"}
sqlalchemy = "^2.0.0"
alembic = "^1.13.0"
pydantic = "^2.7.0"
pydantic-settings = "^2.2.0"
asyncpg = "^0.29.0"
httpx = "^0.27.0"
pdfplumber = "^0.10.0"
PyMuPDF = "^1.23.0"
python-dotenv = "^1.0.0"
psycopg2-binary = "^2.9.12"
reportlab = "^5.0.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.2.0"
pytest-asyncio = "^0.23.0"
pytest-cov = "^5.0.0"
ruff = "^0.5.0"
mypy = "^1.10.0"
pre-commit = "^3.7.0"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
follow_imports = "silent"
warn_return_any = false
warn_unused_configs = false
disallow_untyped_defs = false
explicit_package_bases = true
namespace_packages = true

[[tool.mypy.overrides]]
module = "contract_risk_auditor.domain.models.*"
ignore_errors = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
asyncio_mode = "auto"